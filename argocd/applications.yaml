apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 1password-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mmehta-10/helper-scripts.git
    targetRevision: main
    path: kind-cluster/1password
  destination:
    server: https://kubernetes.default.svc
    namespace: 1password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
