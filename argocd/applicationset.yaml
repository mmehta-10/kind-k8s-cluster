apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kind-cluster-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: 1password-secrets
            namespace: 1password
            path: 1password
          - name: omniroute
            namespace: omniroute
            path: apps/omniroute
          - name: hermes
            namespace: hermes
            path: apps/hermes
  template:
    metadata:
      name: '{{name}}'
      labels:
        app.kubernetes.io/managed-by: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/mmehta-10/kind-k8s-cluster.git
        targetRevision: megha/add-hermes
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
