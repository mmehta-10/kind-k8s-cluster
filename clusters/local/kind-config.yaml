kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80
    protocol: TCP
  - containerPort: 30443
    hostPort: 443
    protocol: TCP
# to expose traefik dashboard
  - containerPort: 32090
    hostPort: 9000
    protocol: TCP
  extraMounts:
  - hostPath: /Users/meghamehta/kind-labs/data/worker1
    containerPath: /data
  - hostPath: /Users/meghamehta/Documents/github/helper-scripts/kind-cluster
    containerPath: /workspace/kind-cluster
    readOnly: false
  - hostPath: /Users/meghamehta/Documents/github/website
    containerPath: /workspace/website
    readOnly: false
